name: Deploy (SSH + Docker Compose)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
      REMOTE: ${{ secrets.REMOTE }}
      BRANCH: ${{ secrets.BRANCH }}
      CHECK_URL: ${{ secrets.CHECK_URL }}
      ALLOW_DIRTY: ${{ secrets.ALLOW_DIRTY }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 不配置 PORT 时默认 22
          port: ${{ secrets.PORT }}
          script_stop: true
          command_timeout: 60m
          script: |
            set -euo pipefail
            cd "${PROJECT_PATH:-/opt/nano-banana-studio}"

            # 推荐直接复用项目自带脚本（包含 build/up/health check）
            chmod +x scripts/update_server.sh
            NBS_REMOTE="${REMOTE:-github}" \
            NBS_BRANCH="${BRANCH:-main}" \
            NBS_CHECK_URL="${CHECK_URL:-http://127.0.0.1:18080}" \
            NBS_ALLOW_DIRTY="${ALLOW_DIRTY:-0}" \
            ./scripts/update_server.sh
