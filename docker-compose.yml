services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nbs-backend
    restart: unless-stopped
    env_file:
      - .env.nbs
    environment:
      EXTERNAL_BASE_URL: "https://kj4rk2oakpguf7.xuanyuan.run"
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/static:/app/backend/static
    # No public port; frontend proxies to backend over the Docker network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_PUBLIC_UPLOAD_URL: ${VITE_PUBLIC_UPLOAD_URL:-/api/upload}
    container_name: nbs-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "18080:80"
